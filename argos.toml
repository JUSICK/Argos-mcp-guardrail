[filesystem]
block_path_traversal = true

blocked_patterns = [".env", ".ssh", "id_rsa", "id_ed25519", "credentials"]

allowed_patterns = [".env.example", ".env.sample", ".env.template"]

[commands]
blocked_commands = [
  "rm -rf",
  "mkfs",
  ":(){ :|:& };:",
  "chmod -R 777",
  "dd if="
]

[audit]
enabled = true
log_allowed = false
log_file = "argos-audit.log"